name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.2.0
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"; exit 1
          fi
      - name: Bump version
        run: |
          sed -i -E "s/^VERSION=\".*\"/VERSION=\"${VERSION}\"/" skills/hinge/scripts/hinge
          jq --arg v "$VERSION" '.version = $v' .claude-plugin/plugin.json > tmp && mv tmp .claude-plugin/plugin.json
          jq --arg v "$VERSION" '.plugins[0].version = $v' .claude-plugin/marketplace.json > tmp && mv tmp .claude-plugin/marketplace.json
          grep -q "VERSION=\"${VERSION}\"" skills/hinge/scripts/hinge
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${VERSION}"
          git tag "$TAG"
          git push origin HEAD "$TAG"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$VERSION" --generate-notes
      - name: Trigger tap update
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SHA256=$(curl -sfL "$URL" | shasum -a 256 | awk '{print $1}')
          gh api repos/artemnovichkov/homebrew-tap/dispatches \
            -f event_type=update-formula \
            -f "client_payload[formula]=hinge" \
            -f "client_payload[url]=$URL" \
            -f "client_payload[sha256]=$SHA256" \
            -f "client_payload[version]=$VERSION"
